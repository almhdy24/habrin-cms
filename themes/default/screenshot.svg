<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect width="600" height="400" fill="#F7F6F2"/>

  <!-- Top Navigation Bar -->
  <rect width="600" height="54" fill="#FFFFFF"/>
  <line x1="0" y1="54" x2="600" y2="54" stroke="#E5E1D8" stroke-width="1"/>

  <!-- Brand Mark -->
  <rect x="36" y="12" width="30" height="30" rx="6" fill="#315C52"/>
  <path d="M45 19v16 M57 19v16 M45 27h12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="76" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#202421">Habrin</text>
  <rect x="132" y="19" width="32" height="16" rx="3" fill="#EAF1EE"/>
  <text x="137" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#315C52">CMS</text>

  <!-- Nav Links -->
  <text x="440" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#59605B">Articles</text>
  <text x="500" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#59605B">About</text>
  <rect x="548" y="16" width="22" height="22" rx="4" fill="#315C52"/>

  <!-- Hero Section -->
  <rect x="36" y="76" width="528" height="90" rx="8" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
  <rect x="56" y="92" width="130" height="18" rx="9" fill="#EAF1EE"/>
  <text x="68" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#315C52">Publish without the clutter</text>
  <text x="56" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#202421">Fast, Private &amp; Flat-File CMS</text>
  <text x="56" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#59605B">Server-rendered simplicity with modern Markdown authoring and zero databases.</text>

  <!-- Post Cards Grid -->
  <g transform="translate(36, 182)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="254" height="190" rx="6" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="18" y="18" width="65" height="14" rx="3" fill="#EAF1EE"/>
    <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#315C52">Oct 15, 2026</text>
    <text x="18" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#202421">Getting Started with Habrin</text>
    <rect x="18" y="68" width="218" height="6" rx="2" fill="#EFECE6"/>
    <rect x="18" y="80" width="180" height="6" rx="2" fill="#EFECE6"/>
    <rect x="18" y="92" width="200" height="6" rx="2" fill="#EFECE6"/>
    <text x="18" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#315C52">Read article →</text>

    <!-- Card 2 -->
    <rect x="274" y="0" width="254" height="190" rx="6" fill="#FFFFFF" stroke="#E5E1D8" stroke-width="1"/>
    <rect x="292" y="18" width="65" height="14" rx="3" fill="#EAF1EE"/>
    <text x="298" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#315C52">Oct 14, 2026</text>
    <text x="292" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#202421">Architecture &amp; JSON Storage</text>
    <rect x="292" y="68" width="218" height="6" rx="2" fill="#EFECE6"/>
    <rect x="292" y="80" width="190" height="6" rx="2" fill="#EFECE6"/>
    <rect x="292" y="92" width="150" height="6" rx="2" fill="#EFECE6"/>
    <text x="292" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#315C52">Read article →</text>
  </g>
